name: Proxy Checker CI & Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python, Shell & SDD Spec Sync Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Shell Scripts and Spec-Code Sync
        run: |
          python -m py_compile scripts/*.py
          for sh in scripts/*.sh; do
            bash -n "$sh"
          done
          bash tools/ci_spec_code_sync.sh
